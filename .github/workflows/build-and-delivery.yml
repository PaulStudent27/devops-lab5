name: Build and Delivery

on:
  workflow_dispatch:
  push:
    branches: ['main']

jobs:
  cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: SUPER DEBUG - find everything
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== LS -LA FULL ==="
          ls -la
          echo "=== FIND requirements.txt ==="
          find . -name "requirements.txt"
          echo "=== CAT requirements.txt ==="
          cat requirements.txt || echo "NOT FOUND"
          echo "=== CHECK .github/workflows/ ==="
          ls -la .github/workflows/ || echo "No workflows folder"
          echo "=== GIT STATUS ==="
          git status
          
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/my-app:latest
